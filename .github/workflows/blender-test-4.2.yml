name: Blender 4.2
description: End-to-end extension tests.

on:
  workflow_run:
    workflows: ["Blender 4.3"]
    types: [requested]

jobs:
  end-to-end-tests:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "Hello from 4.2 test!"

  trigger-failed:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: echo "Tests using previous version failed, current tests skipped"
