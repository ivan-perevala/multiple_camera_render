name: pep8

on:
  push:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - .github/workflows/autopep8.yml

  workflow_dispatch:

permissions:
  contents: write

jobs:
  pep8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: autopep8 checks
        run: |
          python -m pip install autopep8
          autopep8 --in-place --recursive .

      - name: Commit changes
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}[bot]@users.noreply.github.com"

          git diff --quiet || (git commit -am "Formatted with `autopep8`" && git push)
